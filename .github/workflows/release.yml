name: Release Build
on:
  release:
    types: [published]
  workflow_dispatch:
  schedule:
    - cron: '0 3 10 * *'

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-release
  cancel-in-progress: false
  queue: max

jobs:
  build:
    name: Release Build
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - id: variables
        uses: actions/github-script@v9
        with:
          script: |
            let tag;
            if (context.eventName === 'workflow_dispatch' || context.eventName === 'schedule') {
              const { data: release } = await github.rest.repos.getLatestRelease(context.repo);
              tag = release.tag_name;
            } else {
              tag = context.payload.release?.tag_name;
            }
            if (!tag?.startsWith('v')) throw new Error('Expected a v* release tag');
            core.setOutput('ref', tag);
            core.setOutput('snapshot', `${tag}-rebuild-${context.runId}-${process.env.GITHUB_RUN_ATTEMPT}`);
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ steps.variables.outputs.ref }}
          fetch-depth: 0
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASS }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        id: build
        with:
          push: true
          no-cache: ${{ github.event_name == 'schedule' }}
          context: .
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.REGISTRY_USER }}/activity-relay:${{ steps.variables.outputs.ref }}
            ${{ secrets.REGISTRY_USER }}/activity-relay:${{ steps.variables.outputs.snapshot }}
            ghcr.io/${{ secrets.REGISTRY_USER }}/activity-relay/activity-relay:${{ steps.variables.outputs.ref }}
            ghcr.io/${{ secrets.REGISTRY_USER }}/activity-relay/activity-relay:${{ steps.variables.outputs.snapshot }}
      - name: Check latest stable release
        id: latest
        uses: actions/github-script@v9
        env:
          RELEASE_TAG: ${{ steps.variables.outputs.ref }}
        with:
          script: |
            let release;
            try {
              ({ data: release } = await github.rest.repos.getLatestRelease(context.repo));
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const latest = Boolean(release && !release.draft && !release.prerelease &&
              release.tag_name === process.env.RELEASE_TAG);
            core.setOutput('promote', String(latest));
      - name: Publish latest tags
        if: steps.latest.outputs.promote == 'true'
        env:
          DOCKERHUB_IMAGE: ${{ secrets.REGISTRY_USER }}/activity-relay
          GHCR_IMAGE: ghcr.io/${{ secrets.REGISTRY_USER }}/activity-relay/activity-relay
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools create --tag "$DOCKERHUB_IMAGE:latest" "$DOCKERHUB_IMAGE@$DIGEST"
          docker buildx imagetools create --tag "$GHCR_IMAGE:latest" "$GHCR_IMAGE@$DIGEST"

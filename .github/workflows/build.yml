name: Build
on:
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-edge
  cancel-in-progress: false
  queue: max

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASS }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.REGISTRY_USER }}/activity-relay
            ghcr.io/${{ secrets.REGISTRY_USER }}/activity-relay/activity-relay
          outputs: type=image,push-by-digest=true,push=true
      - name: Check master HEAD
        id: edge
        uses: actions/github-script@v9
        with:
          script: |
            const { data: branch } = await github.rest.repos.getBranch({ ...context.repo, branch: 'master' });
            core.setOutput('promote', String(branch.commit.sha === context.sha));
      - name: Publish edge tags
        if: steps.edge.outputs.promote == 'true'
        env:
          DOCKERHUB_IMAGE: ${{ secrets.REGISTRY_USER }}/activity-relay
          GHCR_IMAGE: ghcr.io/${{ secrets.REGISTRY_USER }}/activity-relay/activity-relay
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools create --tag "$DOCKERHUB_IMAGE:edge" "$DOCKERHUB_IMAGE@$DIGEST"
          docker buildx imagetools create --tag "$GHCR_IMAGE:edge" "$GHCR_IMAGE@$DIGEST"
